[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nflprops"
version = "0.1.0"
description = "NFL player-prop decision engine: honest probabilities, Monte Carlo with copula dependence, fractional-Kelly staking, and calibration - all keyless on nflverse data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hermes Agent", email = "mega-byte2600@users.noreply.github.com" }]
keywords = ["nfl", "sports-betting", "player-props", "monte-carlo", "copula", "kelly", "probability", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "build"]
cli = ["click>=8"]

[project.scripts]
nflprops = "nflprops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py39"