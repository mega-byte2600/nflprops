name: iOS

# ADR-0006: compile and unit-test Prop Desk on a macOS runner on every PR touching the app.
# Unsigned simulator build; signing, archiving and upload stay with the owner.
on:
  pull_request:
    paths: ["ios/PropDesk/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/PropDesk/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/PropDesk
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: xcodebuild -version && sw_vers
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          for rt in ios:
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); raise SystemExit
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"
      - name: Build and test (unsigned, simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project PropDesk.xcodeproj -scheme PropDesk \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/PropDesk.xcresult" \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/PropDesk.xcresult" \
            --output-path "$RUNNER_TEMP/screenshots" || echo "attachment export unavailable"
          ls -la "$RUNNER_TEMP/screenshots" || true
      - name: Upload screenshots (I6, for /ios-ux review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screenshots
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/PropDesk.xcresult
