# XcodeGen spec for Prop Desk (ADR-0006). Generate with: cd ios/PropDesk && xcodegen generate
name: PropDesk
options:
  bundleIdPrefix: com.emporion
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.7"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PropDesk:
    type: application
    platform: iOS
    sources:
      - path: PropDesk
        excludes:
          - "PrivacyInfo.xcprivacy"
      # Resources (ADR-0006): asset catalog (AppIcon), bundled snapshot, privacy manifest.
      - path: PropDesk/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emporion.propdesk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prop Desk
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  PropDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PropDeskTests
      - path: PropDesk/Resources/props_snapshot.json
        buildPhase: resources
    dependencies:
      - target: PropDesk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.emporion.propdesk.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PropDesk.app/PropDesk"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PropDesk:
    build:
      targets:
        PropDesk: all
        PropDeskTests: [test]
    test:
      targets:
        - PropDeskTests
